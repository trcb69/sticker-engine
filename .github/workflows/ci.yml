name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Dependabot's pull requests get a read-only token, which gitleaks-action
      # cannot use (403 listing the PR's commits). They only bump versions, and
      # the push to main after merging still runs the scan.
      - name: Secret scan
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
